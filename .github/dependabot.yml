version: 2
updates:
  # pnpm workspace: run from the root only. The root job reads
  # pnpm-workspace.yaml and updates every workspace package.json (and the
  # catalog) together with pnpm-lock.yaml; per-workspace directories never see
  # the root lockfile, so their PRs fail `pnpm install --frozen-lockfile`.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 10
    # Supply-chain quarantine: never propose a version younger than this (a
    # compromised release is usually yanked within hours). Security updates
    # skip it. Mirrors `minimumReleaseAge` in pnpm-workspace.yaml.
    cooldown:
      default-days: 3
      semver-major-days: 7
    commit-message:
      prefix: chore
      include: scope
    # Majors blocked by a peer of @cbrl/eslint-config. Remove each entry once
    # its blocker supports the new major (tracked in kaycabral/toolkit#35):
    #   - typescript >= 7: typescript-eslint peers `typescript <6.1`.
    #   - eslint >= 10: eslint-plugin-jsx-a11y peers `eslint` up to ^9.
    #   - @eslint/js >= 10: peers `eslint` ^10, so it lands with ESLint 10.
    ignore:
      - dependency-name: typescript
        versions: ['>=7']
      - dependency-name: eslint
        versions: ['>=10']
      - dependency-name: '@eslint/js'
        versions: ['>=10']
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # `/` only covers .github/workflows; composite actions live under
  # .github/actions and must be listed or their pins silently drift.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
    groups:
      actions:
        update-types:
          - minor
          - patch
        patterns:
          - '*'
